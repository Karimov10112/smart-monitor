<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Smart Monitor — diabet monitoringi va asoratlar xavfini baholash SDK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06122b"/>
      <stop offset="1" stop-color="#0b2a5b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#60a5fa" stroke-opacity=".08"/>
    </pattern>
    <style>
      .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,monospace}
      .line{stroke-dasharray:1000;animation:draw 4s ease-out infinite}
      @keyframes draw{0%{stroke-dashoffset:1000}60%,100%{stroke-dashoffset:0}}
      .blink{animation:blink 1.4s ease-in-out infinite}
      @keyframes blink{50%{opacity:.3}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>

  <!-- drop logo -->
  <path d="M86 46 C86 46 62 76 62 94 a24 24 0 0 0 48 0 C110 76 86 46 86 46z" fill="url(#blue)"/>
  <path d="M74 96 h7 l4-8 l5 14 l4-6 h6" fill="none" stroke="#06122b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="96" class="sans" font-size="28" font-weight="800" fill="#fff">Smart<tspan fill="url(#blue)">Monitor</tspan></text>
  <text x="330" y="96" class="sans" font-size="16" fill="#93c5fd">· diabetmed.uz</text>

  <text x="64" y="166" class="sans" font-size="40" font-weight="800" fill="#e6f0ff">Diabet monitoringi va</text>
  <text x="64" y="214" class="sans" font-size="40" font-weight="800" fill="url(#blue)">asoratlar xavfini baholash</text>
  <text x="64" y="254" class="sans" font-size="18" fill="#9fb6d9">Ochiq SDK · REST / FHIR R4 integratsiya · AI agent · Web + Android</text>

  <g class="mono" font-size="14">
    <rect x="64" y="276" width="330" height="36" rx="10" fill="#0a1f44" stroke="#1e3a8a"/>
    <text x="82" y="299" fill="#64748b">$</text>
    <text x="100" y="299" fill="#e2e8f0">npm i <tspan fill="#22d3ee">@karimov_dev/diabets</tspan></text>
  </g>

  <!-- CGM chart card -->
  <g transform="translate(700 52)">
    <rect width="440" height="236" rx="16" fill="#0a1f44" stroke="#1e3a8a"/>
    <text x="22" y="34" class="sans" font-size="14" font-weight="600" fill="#93c5fd">Glyukoza · 24 soat</text>
    <text x="418" y="34" class="sans" font-size="13" text-anchor="end" fill="#34d399">TIR 78%</text>
    <!-- target range band 3.9–10 -->
    <rect x="22" y="78" width="396" height="92" fill="#34d399" opacity=".08"/>
    <line x1="22" y1="78" x2="418" y2="78" stroke="#34d399" stroke-opacity=".35" stroke-dasharray="4 4"/>
    <line x1="22" y1="170" x2="418" y2="170" stroke="#34d399" stroke-opacity=".35" stroke-dasharray="4 4"/>
    <path d="M22 140 C60 150 80 100 110 96 S160 150 190 140 S240 70 270 66 S320 130 350 124 S400 100 418 108 V210 H22z" fill="url(#area)"/>
    <path class="line" d="M22 140 C60 150 80 100 110 96 S160 150 190 140 S240 70 270 66 S320 130 350 124 S400 100 418 108" fill="none" stroke="url(#blue)" stroke-width="3.5" stroke-linecap="round"/>
    <circle class="blink" cx="418" cy="108" r="6" fill="#22d3ee"/>
    <g class="sans" font-size="12" fill="#9fb6d9">
      <text x="22" y="226">eA1c 6.8%</text>
      <text x="130" y="226">GMI 6.9%</text>
      <text x="236" y="226">CV 29%</text>
      <text x="326" y="226">FHIR R4 ✓</text>
    </g>
  </g>
</svg>
